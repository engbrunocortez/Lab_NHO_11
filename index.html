<title>Laboratório de Iluminação NHO 11</title>
<meta name="description" content="Simulador didático de avaliação dos níveis de iluminamento em ambientes internos de trabalho conforme a NHO 11 (Fundacentro), com luxímetros Instrutherm LDR-225, LD-550 e LD-400.">

<style>
/* Layout: barra de título + coluna de glossário à esquerda + bancada de trabalho em etapas (planta da sala ao lado do luxímetro virtual) */
:root{
  --bg:#eaeef2; --surface:#ffffff; --surface-2:#f4f6f9; --ink:#16202b; --muted:#566373; --line:#d2d9e1;
  --accent:#e3a300; --accent-ink:#8a5b00; --accent-soft:#fff3cf;
  --ok:#1d7f48; --ok-soft:#e1f3e8; --warn:#a8670c; --warn-soft:#fdf0d9; --bad:#b8352a; --bad-soft:#fbe4e1;
  --floor:#f8f9fb; --wall:#3b4654; --window:#3d8bd1; --furn:#dfe4ea;
  --g-r:#d48f00; --g-q:#2f6fb5; --g-t:#16867a; --g-p:#7b4fb0; --g-task:#c2410c; --g-ent:#8a6d3b;
  --lcd-bg:#c5d3b0; --lcd-ink:#18230f; --lcd-dim:rgba(24,35,15,.16);
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --f-lcd:"Share Tech Mono","JetBrains Mono",ui-monospace,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#171e27; --surface-2:#1d2631; --ink:#e4e9ef; --muted:#97a3b1; --line:#2b3644;
  --accent:#f0b72a; --accent-ink:#f3c552; --accent-soft:#3a2f12;
  --ok:#43c07c; --ok-soft:#14301f; --warn:#e3a54b; --warn-soft:#352813; --bad:#f07466; --bad-soft:#3a1a17;
  --floor:#131a22; --wall:#9aa7b6; --window:#5aa6ea; --furn:#26313d;
  --g-r:#f0b72a; --g-q:#6aa5ea; --g-t:#3cc2b2; --g-p:#b28ae6; --g-task:#ff8a4c; --g-ent:#cfae73;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#171e27; --surface-2:#1d2631; --ink:#e4e9ef; --muted:#97a3b1; --line:#2b3644;
  --accent:#f0b72a; --accent-ink:#f3c552; --accent-soft:#3a2f12;
  --ok:#43c07c; --ok-soft:#14301f; --warn:#e3a54b; --warn-soft:#352813; --bad:#f07466; --bad-soft:#3a1a17;
  --floor:#131a22; --wall:#9aa7b6; --window:#5aa6ea; --furn:#26313d;
  --g-r:#f0b72a; --g-q:#6aa5ea; --g-t:#3cc2b2; --g-p:#b28ae6; --g-task:#ff8a4c; --g-ent:#cfae73;
  color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
h2{font-size:1.65rem;line-height:1.15}
h3{font-size:1.2rem}
p{margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-display);font-size:.82rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);font-weight:600}

/* topo */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:1.55rem;line-height:1}
.brand .sub{font-size:.85rem;color:var(--muted)}
.top .spacer{flex:1}
.chipline{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.chip b{font-weight:600}

/* estrutura */
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);gap:0;min-height:calc(100vh - 70px)}
aside.glos{border-right:1px solid var(--line);background:var(--surface);padding:18px 16px 40px;overflow:auto;max-height:calc(100vh - 70px);position:sticky;top:env(safe-area-inset-top,0px)}
main{padding:18px 22px 60px;min-width:0}
@media (max-width:980px){.shell{grid-template-columns:minmax(0,1fr)}main{padding:16px 16px 48px}aside.glos{position:static;max-height:none;border-right:0;border-top:1px solid var(--line);order:2}}
.glos h2{font-size:1.25rem;margin-bottom:4px}
.glos input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);margin:8px 0 12px}
.glos details{border-bottom:1px solid var(--line);padding:7px 0}
.glos summary{cursor:pointer;font-weight:600;font-size:.93rem;list-style:none;display:flex;justify-content:space-between;gap:8px}
.glos summary::after{content:"+";color:var(--muted);font-family:var(--f-mono)}
.glos details[open] summary::after{content:"–"}
.glos details p{font-size:.88rem;color:var(--muted);margin-top:5px}
.glos .ref{font-size:.75rem;font-family:var(--f-mono);color:var(--accent-ink)}
.glos .group{margin-top:16px;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;font-size:.78rem;color:var(--muted)}

/* etapas */
.steps{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px;scrollbar-width:thin}
.steps button{flex:none;display:flex;align-items:baseline;gap:7px;border:0;background:none;padding:10px 12px 9px;border-bottom:3px solid transparent;cursor:pointer;color:var(--muted);font-family:var(--f-display);font-size:1.05rem;font-weight:600;letter-spacing:.02em}
.steps button .n{font-family:var(--f-mono);font-size:.78rem}
.steps button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.steps button .st{width:8px;height:8px;border-radius:50%;background:var(--line);align-self:center}
.steps button .st.done{background:var(--ok)}
.panel{display:grid;gap:18px}
.lead{max-width:72ch;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:600;font-size:.92rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1300}
.btn.small{padding:4px 10px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
label.f select{width:100%;min-width:0}
select,input[type=text]{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:100%}
.note{font-size:.85rem;color:var(--muted)}
.msg{padding:10px 12px;border-radius:6px;font-size:.9rem;border:1px solid transparent}
.msg.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.msg.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.msg.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px;letter-spacing:.03em;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.na{background:var(--surface-2);color:var(--muted)}

/* cenários */
.scen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.scen{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0;cursor:pointer;display:flex;flex-direction:column;overflow:hidden}
.scen:hover{border-color:var(--accent)}
.scen[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.scen svg{display:block;width:100%;height:auto;background:var(--floor);border-bottom:1px solid var(--line)}
.scen .t{padding:10px 12px 12px;display:grid;gap:4px}
.scen .t b{font-family:var(--f-display);font-size:1.15rem;font-weight:600}
.scen .t span{font-size:.82rem;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px}
.fact{display:grid;gap:1px}
.fact span{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fact b{font-weight:600}
ul.obs{margin:6px 0 0;padding-left:18px;display:grid;gap:5px}
ul.obs li{font-size:.93rem}

/* tabelas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;background:var(--surface-2);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

/* instrumentos */
.inst-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:14px}
.inst{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;display:grid;gap:10px;align-content:start;cursor:pointer;text-align:left}
.inst[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.inst h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.inst ul{margin:0;padding-left:17px;font-size:.86rem;display:grid;gap:3px}
.cert{font-size:.84rem;border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:2px}

/* bancada */
.bench{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:16px;align-items:start}
@media (max-width:1180px){.bench{grid-template-columns:1fr}}
.plan-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.plan-wrap svg{width:100%;height:auto;display:block;touch-action:manipulation}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.pt{cursor:pointer}
.pt circle.ring{fill:var(--surface);stroke-width:2.2}
.pt.done circle.ring{stroke-width:0}
.pt text{font-family:var(--f-mono);font-size:10px;pointer-events:none}
.pt:hover circle.ring{stroke-width:3.4}
.sensor{pointer-events:none}

/* luxímetro */
.meter-col{display:grid;gap:12px}
.meter{border-radius:18px;padding:16px 16px 18px;display:grid;gap:12px;color:#eef1f4;position:relative}
.meter.m-ldr225{background:linear-gradient(160deg,#2c3540,#1b222b);border:2px solid #e3a300}
.meter.m-ld550{background:linear-gradient(160deg,#36506b,#223448);border:2px solid #7d9bbb}
.meter.m-ld400{background:linear-gradient(160deg,#363c43,#22272d);border:5px solid #e0742a}
.meter .mtop{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);letter-spacing:.06em}
.meter .mtop b{font-size:1.2rem}
.meter .mtop span{font-size:.75rem;opacity:.75;text-transform:uppercase}
.lcd{background:var(--lcd-bg);color:var(--lcd-ink);border-radius:8px;padding:8px 12px 10px;box-shadow:inset 0 2px 6px rgba(0,0,0,.35);font-family:var(--f-lcd);position:relative;min-height:112px}
.lcd .ann{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.72rem;letter-spacing:.06em}
.lcd .ann span{opacity:.12}
.lcd .ann span.on{opacity:1}
.lcd .digits{font-size:3.1rem;line-height:1.05;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.lcd .digits small{font-size:1rem;margin-left:6px}
.lcd .bar{height:6px;background:var(--lcd-dim);border-radius:2px;overflow:hidden;margin-top:4px}
.lcd .bar i{display:block;height:100%;background:var(--lcd-ink);width:0}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{border:0;border-radius:9px;padding:9px 4px 8px;background:#3d4955;color:#f4f6f8;font-family:var(--f-display);font-weight:600;letter-spacing:.05em;font-size:.88rem;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.key.pwr{background:#b8352a}
.key.rec{background:#c58a00;color:#1b1300}
.key:disabled{opacity:.3;cursor:not-allowed}
.photocell{display:flex;align-items:center;gap:10px;font-size:.78rem;opacity:.85}
.photocell .dome{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffffff,#d9dde2 45%,#8b939c);border:3px solid #111;flex:none}
.meter .disclaim{font-size:.7rem;opacity:.6}
.ctrls{display:grid;gap:10px}
.ctrls .row label.f{flex:1 1 200px}
.memlist{font-family:var(--f-mono);font-size:.78rem;max-height:120px;overflow:auto;color:var(--muted)}
.where{font-size:.9rem}
.where b{font-family:var(--f-mono)}

/* preliminar */
.chk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#1b1300}
.chk .fb{grid-column:1/-1;font-size:.82rem}

/* resultados */
.formula{font-family:var(--f-mono);font-size:.9rem;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;white-space:pre}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface)}
.kpi span{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi b{font-family:var(--f-mono);font-size:1.35rem;font-weight:600}
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;max-width:900px}
.report h3{margin-top:18px;font-size:1.15rem;border-bottom:1px solid var(--line);padding-bottom:3px}
.report h3:first-of-type{margin-top:6px}
.report p,.report li{font-size:.93rem;max-width:80ch}
.report ul{padding-left:18px;margin:6px 0}
.report .tbl-wrap{margin:8px 0}
.flag-list{display:grid;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="shell">

const GLOSS = [

<script>
"use strict";
/* ============================================================

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (v, d=0) => (v==null || isNaN(v)) ? "—" : Number(v).toLocaleString("pt-BR",{minimumFractionDigits:d, maximumFractionDigits:d});
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
let seed = (Date.now() ^ 0x5bd1e995) >>> 0;
function rnd(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
function gauss(){ let u=0,v=0; while(!u) u=rnd(); while(!v) v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const dateBR = d => d.toLocaleDateString("pt-BR");
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const TODAY = new Date();
const CASOS = {
  1:"Área retangular com luminárias em padrão regular, simetricamente espaçadas em duas ou mais fileiras (Figura A1)",
  2:"Área retangular com luminária central (Figura A2)",

};
const COND = {
  sol_aberta:{n:"Dia ensolarado, cortinas/persianas abertas", D:2600},

/* ============================================================
   GEOMETRIA DOS CASOS DO ANEXO 1
   ============================================================ */
function build(sc){
  const {L,W,H} = sc; const lums=[], src=[], pts=[];
  const P = (id,x,y) => pts.push({id, grp:id[0], x:clamp(x,.15,L-.15), y:clamp(y,.15,W-.15), kind:"grid"});
  const addSrc = (x,y,I,lum) => src.push({x,y,z:H,I,lum});
  if(sc.caso===1){
    const N=sc.N, M=sc.M, sx=L/N, sy=W/M;
    for(let j=0;j<M;j++) for(let i=0;i<N;i++){
      const x=sx*(i+.5), y=sy*(j+.5), idx=lums.length;
      if(sc.forma==="tubular"){ lums.push({idx,x,y,w:1.25,h:.32,f:"tub"}); [-.4,0,.4].forEach(d=>addSrc(x+d,y,1/3,idx)); }
      else { lums.push({idx,x,y,w:.6,h:.6,f:"pan"}); addSrc(x,y,1,idx); }
    }
    const i0=Math.max(0,Math.floor((N-2)/2)), j0=Math.max(0,Math.floor((M-2)/2));
    const bay=(i,j)=>[sx*(i+1), sy*(j+1)];
    let [cx,cy]=bay(i0,j0);
    P("r1",cx-sx/4,cy-sy/4); P("r2",cx+sx/4,cy-sy/4); P("r3",cx-sx/4,cy+sy/4); P("r4",cx+sx/4,cy+sy/4);
    let b2 = (N-2>i0) ? bay(i0+1,j0) : (M-2>j0 ? bay(i0,j0+1) : null);
    if(b2){ [cx,cy]=b2; P("r5",cx-sx/4,cy-sy/4); P("r6",cx+sx/4,cy-sy/4); P("r7",cx-sx/4,cy+sy/4); P("r8",cx+sx/4,cy+sy/4); }
    else { P("r5",cx,cy-sy/3); P("r6",cx+sx/3,cy); P("r7",cx,cy+sy/3); P("r8",cx-sx/3,cy); }
    const cq1=sx*(i0+1), cq2=sx*(N-2-i0+1);
    P("q1",cq1-sx/4,sy/4); P("q2",cq1+sx/4,sy/4); P("q3",cq2-sx/4,W-sy/4); P("q4",cq2+sx/4,W-sy/4);
    const ct1=sy*(j0+1), ct2=sy*(M-2-j0+1);
    P("t1",sx/4,ct1-sy/4); P("t2",sx/4,ct1+sy/4); P("t3",L-sx/4,ct2-sy/4); P("t4",L-sx/4,ct2+sy/4);
    P("p1",sx/4,sy/4); P("p2",L-sx/4,W-sy/4);
  } else if(sc.caso===2){
    lums.push({idx:0,x:L/2,y:W/2,w:.9,h:.9,f:"cen"}); addSrc(L/2,W/2,1,0);
    P("p1",L/4,W/4); P("p2",3*L/4,W/4); P("p3",L/4,3*W/4); P("p4",3*L/4,3*W/4);
  } else if(sc.caso===3){
    const N=sc.N, sx=L/N, y=W/2;
    for(let i=0;i<N;i++){ const x=sx*(i+.5); lums.push({idx:i,x,y,w:.75,h:.75,f:"camp"}); addSrc(x,y,1,i); }
    const a=Math.max(0,Math.floor((N-1)/2)-1), b=Math.min(N-2,a+1);
    const ca=sx*(a+1), cb=sx*(b+1);
    P("q1",ca-sx/4,W/4); P("q2",ca+sx/4,W/4); P("q3",cb-sx/4,W/4); P("q4",cb+sx/4,W/4);
    P("q5",ca-sx/4,3*W/4); P("q6",ca+sx/4,3*W/4); P("q7",cb-sx/4,3*W/4); P("q8",cb+sx/4,3*W/4);
    P("p1",sx/4,3*W/4); P("p2",L-sx/4,W/4);
  } else if(sc.caso===4){
    const N=sc.N, M=sc.M, sy=W/M, e=.6, len=(L-2*e)/N;
    for(let j=0;j<M;j++){ const y=sy*(j+.5);
      for(let i=0;i<N;i++){ const idx=lums.length, x0=e+i*len; lums.push({idx,x:x0+len/2,y,w:len,h:.22,f:"cont"});
        for(let s=x0+.15; s<x0+len; s+=.3) addSrc(s,y,.3,idx); } }
    const j0=Math.max(0,Math.floor((M-2)/2)), yc=sy*(j0+1), yt=sy*(M-1-j0);
    P("r1",L/2-L/12,yc-sy/4); P("r2",L/2+L/12,yc-sy/4); P("r3",L/2-L/8,yc+sy/4); P("r4",L/2+L/24,yc+sy/4);
    P("q1",L/2,sy/4); P("q2",L/2,W-sy/4);
    P("t1",e/2,yc-sy/4); P("t2",e/2,yc+sy/4); P("t3",L-e/2,yt-sy/4); P("t4",L-e/2,yt+sy/4);
    P("p1",e/2,sy/4); P("p2",L-e/2,W-sy/4);
  } else if(sc.caso===5){
    const N=sc.N, e=L/10, len=(L-2*e)/N, y=W/2;
    for(let i=0;i<N;i++){ const x0=e+i*len; lums.push({idx:i,x:x0+len/2,y,w:len,h:.22,f:"cont"});
      for(let s=x0+.15; s<x0+len; s+=.3) addSrc(s,y,.3,i); }
    P("q1",L/4,W/4); P("q2",L/2,W/4); P("q3",3*L/4,W/4); P("q4",L/4,3*W/4); P("q5",L/2,3*W/4); P("q6",3*L/4,3*W/4);
    P("p1",e/2,W/4); P("p2",L-e/2,3*W/4);
  } else if(sc.caso===6){
    lums.push({idx:-1,x:L/2,y:W/2,w:L-.6,h:W-.6,f:"teto"});
    for(let x=.25;x<L;x+=.5) for(let y=.25;y<W;y+=.5) addSrc(x,y,.25,-1);
    P("r1",L*.47,W*.33); P("r2",L*.33,W*.55); P("r3",L*.64,W*.52); P("r4",L*.52,W*.7);
    P("q1",L*.58,.6); P("q2",L*.4,W-.6); P("t1",.6,W*.6); P("t2",L-.6,W*.4); P("p1",.6,.6); P("p2",L-.6,W-.6);
  }
  const ordem = {r:1,q:2,t:3,p:4};
  pts.sort((a,b)=> ordem[a.grp]-ordem[b.grp] || a.id.localeCompare(b.id, "pt", {numeric:true}));
  const tasks = sc.tarefas.map(t => ({...t, kind:"task", grp:"T", nrm: t.pl==="H" ? [0,0,1] : t.nrm}));
  const ents = [];
  tasks.filter(t=>t.supl).forEach(t=>{
    [[.6,0],[0,.6],[-.6,0],[0,-.6]].forEach((d,k)=>{
      ents.push({id:`E${t.id.slice(1)}.${k+1}`, kind:"ent", grp:"E", task:t.id, x:clamp(t.x+d[0],.15,L-.15), y:clamp(t.y+d[1],.15,W-.15), z:t.z, nrm:[0,0,1]});
    });
  });
  return {lums, src, pts, tasks, ents};
}

/* ============================================================
   MODELO FOTOMÉTRICO (didático)
   ============================================================ */
function direct(scene, m, x,y,z,n, onlyOn=true){
  let e=0;
  for(const s of scene.src){
    if(onlyOn && s.off) continue;
    const dx=s.x-x, dy=s.y-y, dz=s.z-z; if(dz<=0) continue;
    const d2=dx*dx+dy*dy+dz*dz, d=Math.sqrt(d2), cT=dz/d, cI=(dx*n[0]+dy*n[1]+dz*n[2])/d;
    if(cI<=0) continue;
    e += s.I*Math.pow(cT,m)*cI/d2;
  }
  return e;
}
function calibrate(){
  const sc=S.scen, sn=S.scene; let sum=0, k=0;
  for(let x=.6;x<=sc.L-.6;x+=.5) for(let y=.6;y<=sc.W-.6;y+=.5){ sum+=direct(sn,sc.m,x,y,.75,[0,0,1],false); k++; }
  const avgAll=sum/k; let sumOn=0;
  for(let x=.6;x<=sc.L-.6;x+=.5) for(let y=.6;y<=sc.W-.6;y+=.5){ sumOn+=direct(sn,sc.m,x,y,.75,[0,0,1],true); }
  sn.avgD=avgAll; sn.avgOn=sumOn/k;
  sn.k = sc.design/(avgAll*(1+sc.refl));
  sn.supl={};
  sn.tasks.filter(t=>t.supl).forEach(t=>{
    const base=artificial(t.x,t.y,t.z,t.nrm);
    const unit=Math.pow(1,8)*1/(.55*.55);
    sn.supl[t.id]={x:t.x,y:t.y,z:t.z+.55, I:Math.max(0,t.supl-base)/unit};
  });
}
function artificial(x,y,z,n){
  const sc=S.scen, sn=S.scene;
  const dir=direct(sn,sc.m,x,y,z,n,true);
  const ind=sc.refl*sn.avgOn*(n[2]>.9?1:.9);
  return sn.k*(dir+ind)*S.v.maint;
}
function suplAt(taskId,x,y,z,n){
  const s=S.scene.supl && S.scene.supl[taskId]; if(!s) return 0;
  const dx=s.x-x, dy=s.y-y, dz=s.z-z; if(dz<=0) return 0;
  const d2=dx*dx+dy*dy+dz*dz, d=Math.sqrt(d2), cT=dz/d, cI=(dx*n[0]+dy*n[1]+dz*n[2])/d;
  if(cI<=0) return 0; return s.I*Math.pow(cT,8)*cI/d2;
}
function daylight(x,y,n,cond){
  const sc=S.scen; if(!sc.janelas.length) return 0;
  const D=COND[cond].D; if(!D) return 0;
  let e=0;
  sc.janelas.forEach(w=>{
    const dist = w==="N"? y : w==="S"? sc.W-y : w==="O"? x : sc.L-x;
    e += D*Math.exp(-dist/1.8);
  });
  return e*(n[2]>.9?1:.6);
}
function getPt(id){ const sn=S.scene; return sn.pts.find(p=>p.id===id) || sn.tasks.find(p=>p.id===id) || sn.ents.find(p=>p.id===id); }
function geomFor(pt, pos){
  if(pos==="tarefa"){
    if(pt.kind==="task") return {z:pt.z, n:pt.nrm};
    if(pt.kind==="ent") return {z:pt.z, n:[0,0,1]};
    return {z:.75, n:[0,0,1]};
  }
  return {z:POS[pos].z, n:[0,0,1]};
}
function refGeom(pt){ return pt.kind==="grid" ? {z:.75,n:[0,0,1]} : {z:pt.z, n:pt.kind==="task"?pt.nrm:[0,0,1]}; }
function fieldAt(pt, pos, cond, post, roupa){
  const g=geomFor(pt,pos);
  let art=artificial(pt.x,pt.y,g.z,g.n);
  const ov = S.scen.override && S.scen.override[pt.id];
  if(ov!=null){ const r=refGeom(pt); art = ov*art/Math.max(1e-6,artificial(pt.x,pt.y,r.z,r.n)); }
  const tid = pt.kind==="task" ? pt.id : pt.kind==="ent" ? pt.task : null;
  if(tid) art += suplAt(tid, pt.x, pt.y, g.z, g.n);
  const day = daylight(pt.x,pt.y,g.n,cond);
  let E = art + day;
  if(post==="inclinado") E *= .86;
  if(roupa==="clara") E *= 1.03;
  return {E, art, day};
}
function idealAt(pt){ // procedimento correto, sem erros instrumentais
  const r = pt.kind==="grid" ? "h075" : "tarefa";
  return fieldAt(pt, r, "noite", "afastado", "escura").art;
}
function spectral(instId, sel, real){
  if(instId==="LD400") return real==="LED" ? .84 : 1;
  if(sel===real) return 1;
  if(sel==="PAD") return ({LED:.89, FLU:.95, SOD:1.07})[real] || .93;
  return .93;
}

/* ============================================================
   ESTADO
   ============================================================ */
const S = { tab:0, scen:null, scene:null, v:null };
function freshMeter(){
  return {on:false, unit:"lux", hold:false, holdVal:null, holdPt:null, mm:0, mmMax:null, mmMin:null, mmSum:0, mmN:0,
          rIdx:1, sel:"PAD", mem:[], acq:0, acqClean:0, clean:0, stable:false, cur:null, last:performance.now(), powerAt:0};
}
function rollVariation(sc){
  const v = {maint: sc.maintFix ?? +(0.82+rnd()*.18).toFixed(2), burned:-1, certExp:null, bias:{}};
  const sn=S.scene;
  const nl = sn.lums.filter(l=>l.idx>=0).length;
  if(sc.burnForce!=null) v.burned = sc.burnForce;
  else if(sc.burnP && rnd()<sc.burnP && nl>2) v.burned = Math.floor(rnd()*nl);
  if(rnd()<.5){ const ks=Object.keys(INSTR); v.certExp = ks[Math.floor(rnd()*ks.length)]; }
  Object.keys(INSTR).forEach(k=>{ v.bias[k] = 1 + (rnd()*2-1)*.012 + (v.certExp===k ? .055 : 0); });
  v.certDate = {}; Object.keys(INSTR).forEach(k=>{ v.certDate[k] = addDays(TODAY, -(v.certExp===k ? 400+Math.floor(rnd()*60) : 40+Math.floor(rnd()*230))); });
  v.certN = {}; Object.keys(INSTR).forEach((k,i)=>{ v.certN[k] = `LUX-${TODAY.getFullYear()-1}/${String(Math.floor(1000+rnd()*8999))}`; });
  return v;
}
function selectScenario(id, keepTab){
  const sc = SCEN.find(s=>s.id===id);
  S.scen = sc; S.scene = build(sc); S.v = rollVariation(sc);
  S.scene.src.forEach(s=>{ s.off = (s.lum>=0 && s.lum===S.v.burned); });
  calibrate();
  Object.assign(S, {
    caseSel:null, nSel:"", mSel:"", caseOk:false, enqChecked:false, quadroSel:{}, ajusteSel:null, ajusteMot:"",
    inst:null, certAns:null, roupa:"clara",
    meter:freshMeter(), pos:"h120", cond: sc.janelas.length ? "sol_aberta" : "noite", post:"afastado",
    at:null, rec:{}, prelim:{}, prelimChecked:false, corSel:null, avaliador:"", msg:null
  });
  if(!sc.janelas.length && sc.noturno) S.cond="noite";
  if(!keepTab) S.tab=0;
  render();
}
function reroll(){
  const id=S.scen.id; const keep=S.tab; selectScenario(id, true); S.tab=keep; render();
}
function dynObs(){
  const o=[...S.scen.obs];
  if(S.v.burned>=0 && S.scen.burnForce==null) o.push("Uma das luminárias está apagada (lâmpada queimada) e não há registro de solicitação de troca.");
  if(S.v.maint<.88 && S.scen.maintFix==null) o.push("As luminárias e os difusores apresentam acúmulo visível de poeira; não há rotina de limpeza documentada.");
  return o;
}
function truth(){
  const t={...S.scen.verdade};
  if(S.v.burned>=0) t.a15="N";
  if(S.v.maint<.88 && S.scen.maintFix==null) t.a14="N";
  return t;
}
function aparencia(tcp){ return tcp<3300 ? "Quente" : tcp<=5300 ? "Intermediária" : "Fria"; }

const TABS = ["Cenário","Enquadramento","Instrumento","Avaliação preliminar","Medição","Resultados e relatório"];
function stepDone(i){
  if(!S.scen) return false;
  if(i===0) return true;
  if(i===1) return S.caseOk && S.enqChecked;
  if(i===2) return !!S.inst && S.certAns!=null;
  if(i===3) return S.prelimChecked;
  if(i===4) return progress().all;
  if(i===5) return progress().all;
}
function progress(){
  if(!S.scene) return {g:0,gt:0,t:0,tt:0,e:0,et:0,all:false};

  const g=sn.pts.filter(p=>r[p.id]).length, t=sn.tasks.filter(p=>r[p.id]).length, e=sn.ents.filter(p=>r[p.id]).length;
  return {g, gt:sn.pts.length, t, tt:sn.tasks.length, e, et:sn.ents.length, all: S.caseOk && g===sn.pts.length && t===sn.tasks.length && e===sn.ents.length};
}

/* ---------- planta da sala (SVG) ---------- */
function planSVG(opt={}){
  const sc=S.scen, sn=S.scene, mini=!!opt.mini;
  return planSVGFor(sc, sn, mini, opt);
}
function planSVGFor(sc, sn, mini, opt={}){
  const sm = mini ? 18 : Math.min(70, 1000/sc.L);
  const pad = mini ? 10 : 34;
  const Wd=sc.L*sm+2*pad, Hd=sc.W*sm+2*pad + (mini?0:22);
  const X=x=>pad+x*sm, Y=y=>pad+y*sm;
  const fs = mini ? 9 : Math.max(12, Wd/50);
  let s=`<svg viewBox="0 0 ${Wd.toFixed(1)} ${Hd.toFixed(1)}" role="img" aria-label="Planta de ${esc(sc.nome)}">`;
  s+=`<defs><pattern id="hatch${mini?"m":""}${sc.id}" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="var(--accent)" stroke-width="1.4" opacity=".55"/></pattern></defs>`;
  s+=`<rect x="${X(0)}" y="${Y(0)}" width="${sc.L*sm}" height="${sc.W*sm}" fill="var(--floor)" stroke="var(--wall)" stroke-width="${mini?2:3}"/>`;
  // janelas
  sc.janelas.forEach(w=>{
    const t=mini?3:5; let x1,y1,x2,y2;
    if(w==="N"){x1=X(sc.L*.15);x2=X(sc.L*.85);y1=y2=Y(0);} if(w==="S"){x1=X(sc.L*.15);x2=X(sc.L*.85);y1=y2=Y(sc.W);}
    if(w==="O"){y1=Y(sc.W*.15);y2=Y(sc.W*.85);x1=x2=X(0);} if(w==="L"){y1=Y(sc.W*.15);y2=Y(sc.W*.85);x1=x2=X(sc.L);}
    s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--window)" stroke-width="${t*1.6}"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--floor)" stroke-width="${t*.5}"/>`;
  });
  // mobiliário
  sc.mobilia.forEach(f=>{
    s+=`<rect x="${X(f.x)}" y="${Y(f.y)}" width="${f.w*sm}" height="${f.h*sm}" rx="2" fill="var(--furn)" stroke="var(--line)"/>`;
    if(!mini && f.w*sm>40) s+=`<text x="${X(f.x+f.w/2)}" y="${Y(f.y+f.h/2)+fs*.35}" text-anchor="middle" font-size="${fs*.8}" fill="var(--muted)" font-family="var(--f-body)">${esc(f.n)}</text>`;
  });
  // luminárias
  sn.lums.forEach(l=>{
    const burned = !mini && S.v && l.idx===S.v.burned && l.idx>=0 && S.scen===sc;
    const fill = burned ? "var(--line)" : "var(--accent)";
    if(l.f==="teto"){ s+=`<rect x="${X(l.x-l.w/2)}" y="${Y(l.y-l.h/2)}" width="${l.w*sm}" height="${l.h*sm}" fill="url(#hatch${mini?"m":""}${sc.id})" stroke="var(--accent)" stroke-dasharray="6 4"/>`; return; }
    if(l.f==="camp"||l.f==="cen"){ s+=`<circle cx="${X(l.x)}" cy="${Y(l.y)}" r="${l.w/2*sm}" fill="${fill}" fill-opacity="${burned?1:.85}" stroke="var(--wall)" stroke-width="1"/>`; }
    else s+=`<rect x="${X(l.x-l.w/2)}" y="${Y(l.y-l.h/2)}" width="${l.w*sm}" height="${Math.max(l.h*sm,2)}" fill="${fill}" fill-opacity="${burned?1:.85}" stroke="var(--wall)" stroke-width="${mini?.5:1}"/>`;
    if(burned){ const r=Math.min(Math.max(l.w,l.h)/2,.5)*sm*.9; s+=`<path d="M${X(l.x)-r} ${Y(l.y)-r}L${X(l.x)+r} ${Y(l.y)+r}M${X(l.x)+r} ${Y(l.y)-r}L${X(l.x)-r} ${Y(l.y)+r}" stroke="var(--bad)" stroke-width="2"/>`; }
  });
  if(mini){ s+="</svg>"; return s; }
  // cotas
  s+=`<text x="${X(sc.L/2)}" y="${Hd-8}" text-anchor="middle" font-size="${fs*.85}" fill="var(--muted)" font-family="var(--f-mono)">L = ${fmt(sc.L,1)} m · W = ${fmt(sc.W,1)} m · luminárias a ${fmt(sc.H,1)} m do piso</text>`;
  // pontos
  const showPts = opt.points;
  if(showPts){
    const r=fs*.95;
    const col = g => ({r:"var(--g-r)",q:"var(--g-q)",t:"var(--g-t)",p:"var(--g-p)",T:"var(--g-task)",E:"var(--g-ent)"})[g];
    const all=[...(S.caseOk?sn.pts:[]), ...sn.tasks, ...sn.ents];
    all.forEach(p=>{
      const done=!!S.rec[p.id], c=col(p.grp), cx=X(p.x), cy=Y(p.y);
      const shape = p.kind==="grid" ? `<circle class="ring" cx="${cx}" cy="${cy}" r="${r}" stroke="${c}" ${done?`style="fill:${c}"`:""}/>`
        : p.kind==="task" ? `<rect class="ring" x="${cx-r}" y="${cy-r}" width="${2*r}" height="${2*r}" rx="2" transform="rotate(45 ${cx} ${cy})" stroke="${c}" stroke-width="2.2" style="fill:${done?c:"var(--surface)"}"/>`
        : `<circle class="ring" cx="${cx}" cy="${cy}" r="${r*.7}" stroke="${c}" stroke-dasharray="3 2" ${done?`style="fill:${c}"`:""}/>`;
      const lbl = p.kind==="ent" ? "e"+p.id.split(".")[1] : p.id;
      s+=`<g class="pt ${done?"done":""}" data-pt="${p.id}" tabindex="0" role="button" aria-label="Ponto ${p.id}">${shape}<text x="${cx}" y="${cy+3.5}" text-anchor="middle" fill="${done?"var(--surface)":c}" font-weight="600" font-size="${p.kind==="ent"?fs*.65:fs*.8}">${esc(lbl)}</text>`;
      if(done) s+=`<text x="${cx}" y="${cy+r+fs}" text-anchor="middle" fill="var(--ink)" font-size="${fs*.78}">${fmt(S.rec[p.id].v,0)}</text>`;
      s+=`</g>`;
    });
    if(S.at){ const p=getPt(S.at); if(p){ const cx=X(p.x), cy=Y(p.y), R=r*1.9;
      s+=`<g class="sensor"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M${cx-R-6} ${cy}H${cx-R+4}M${cx+R-4} ${cy}H${cx+R+6}M${cx} ${cy-R-6}V${cy-R+4}M${cx} ${cy+R-4}V${cy+R+6}" stroke="var(--ink)" stroke-width="1.5"/></g>`; } }
  }
  s+="</svg>"; return s;
}

function quadroOptions(sel){

  return `<option value="">Selecione a atividade no Quadro 1…</option>` + Object.entries(groups).map(([g,arr])=>`<optgroup label="${esc(g)}">${arr.map(([k,q])=>`<option value="${k}" ${sel===k?"selected":""}>${esc(q.n)} – ${fmt(q.E)} lux / IRC ${q.IRC}</option>`).join("")}</optgroup>`).join("");
}

  v.querySelectorAll("#roupaSeg button").forEach(b=>b.onclick=()=>{ S.roupa=b.dataset.r; render(); });
  wireNext(v);
}

/* ============================================================
   ABA 4 – AVALIAÇÃO PRELIMINAR
   ============================================================ */
function vPreliminar(v){
  const sc=S.scen, tr=truth();
  const rows = A3.map(([id,q])=>{
    const a=S.prelim[id]; let fb="";
    if(S.prelimChecked && tr[id]){

      fb=`<div class="fb"><span class="pill ${ok?"ok":"bad"}">${ok?"Coerente com as observações":"Reveja"}</span> ${ok?"":`Pelas observações de campo, a resposta esperada é “${tr[id]==="S"?"Sim":"Não"}”.`}</div>`;
    }
    return `<div class="chk"><span>${esc(q)}</span><span class="seg" data-a="${id}">${["S","N","NA"].map(o=>`<button aria-pressed="${a===o}" data-o="${o}">${o==="S"?"Sim":o==="N"?"Não":"N.A."}</button>`).join("")}</span>${fb}</div>`;
  }).join("");

  v.innerHTML = `<div><div class="eyebrow">Etapa 4</div><h2>Avaliação preliminar (item 6.1)</h2></div>
   <p class="lead">Leia as observações feitas na visita ao local e responda à lista de verificação do Quadro A3 (Anexo 3). Use “N.A.” quando a pergunta não se aplicar ao ambiente.</p>
   <div class="grid2">
     <div class="card"><h3>Observações de campo</h3><ul class="obs">${dynObs().map(o=>`<li>${esc(o)}</li>`).join("")}</ul></div>
     <div class="card" style="display:grid;gap:10px;align-content:start">
       <h3>Aparência da cor (Quadro A1)</h3>
       <p class="note">Lâmpada com Tcp de ${fmt(sc.lamp.Tcp)} K informada pelo fabricante.</p>
       <span class="seg" id="corSeg">${["Quente","Intermediária","Fria"].map(c=>`<button aria-pressed="${S.corSel===c}" data-c="${c}">${c}</button>`).join("")}</span>
       ${corFb}
     </div>
   </div>
   <div class="card"><h3>Quadro A3 – Lista de verificação do sistema de iluminação</h3>${rows}</div>
   <div class="row"><button class="btn primary" id="chkPre">Conferir avaliação preliminar</button></div>
   ${S.prelimChecked?nextBtn("Ir para a medição"):""}`;
  v.querySelectorAll("[data-a]").forEach(seg=>seg.querySelectorAll("button").forEach(b=>b.onclick=()=>{ S.prelim[seg.dataset.a]=b.dataset.o; seg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b)); }));
  v.querySelectorAll("#corSeg button").forEach(b=>b.onclick=()=>{ S.corSel=b.dataset.c; v.querySelectorAll("#corSeg button").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  $("#chkPre").onclick=()=>{ S.prelimChecked=true; render(); };
  wireNext(v);
}

/* ============================================================
   ABA 5 – MEDIÇÃO (luxímetro virtual)
   ============================================================ */
function rangeInfo(){
  const it=INSTR[S.inst], M=S.meter;
  if(it.autoR) return null;
  const R=it.ranges[M.rIdx]; return {R, res: R/it.counts};
}
function displayValue(lux){
  const it=INSTR[S.inst], M=S.meter;
  let v = M.unit==="fc" ? lux/10.764 : lux;
  if(it.autoR){
    if(v>999900) return {txt:"OL", num:null, res:null};
    const res = v<400 ? .1 : v<4000 ? 1 : v<40000 ? 10 : 100;
    const n=Math.round(v/res)*res; return {txt:fmt(n, res<1?1:0), num:n, res};
  }
  const ri=rangeInfo(); let R=ri.R, res=ri.res;
  if(M.unit==="fc"){ R=R/10.764; }
  if(v>R*1.0){ return {txt: S.inst==="LD400" ? "1&nbsp;&nbsp;&nbsp;&nbsp;" : "OL", num:null, res}; }
  const dec = res<.05 ? 2 : res<.5 ? 1 : 0;
  const step = dec===2 ? .01 : dec===1 ? .1 : res>=100 ? 100 : res>=10 ? 10 : 1;
  const n=Math.round(v/step)*step; return {txt:fmt(n,dec), num:n, res:step};
}
function meterTick(){
  if(S.tab!==4 || !S.inst) return;
  const M=S.meter, now=performance.now(), dt=Math.min(1,(now-M.last)/1000); M.last=now;
  if(M.on){
    let clean=0, noisy=0;
    if(S.at){
      const pt=getPt(S.at); const f=fieldAt(pt,S.pos,S.cond,S.post,S.roupa);
      const sel = INSTR[S.inst].lampSel ? M.sel : "PAD";
      clean = f.E*spectral(S.inst, sel, S.scen.lamp.tipo)*S.v.bias[S.inst];
      noisy = clean*(1+gauss()*INSTR[S.inst].sd);
    }
    const tau = (now-M.powerAt<4000) ? 1.2 : .5, a=1-Math.exp(-dt/tau);
    M.acqClean += (clean-M.acqClean)*a; M.clean=clean;
    M.acq = clean>0 ? M.acqClean*(noisy/clean) : M.acqClean;
    M.stable = clean>0 && Math.abs(M.acqClean-clean)/clean < .015;
    if(!M.hold){
      M.cur = M.acq;
      if(M.mm){ M.mmMax = M.mmMax==null?M.cur:Math.max(M.mmMax,M.cur); M.mmMin = M.mmMin==null?M.cur:Math.min(M.mmMin,M.cur); M.mmSum+=M.cur; M.mmN++; }
    }
  }
  drawLCD();
}
function shownLux(){
  const M=S.meter; if(!M.on) return null;
  if(M.hold) return M.holdVal;
  if(M.mm===1) return M.mmMax; if(M.mm===2) return M.mmMin; if(M.mm===3) return M.mmN?M.mmSum/M.mmN:null;
  return M.cur;
}
function drawLCD(){
  const el=$("#lcd"); if(!el) return; const M=S.meter, it=INSTR[S.inst];
  if(!M.on){ el.querySelector(".digits").innerHTML="&nbsp;"; el.querySelectorAll(".ann span").forEach(s=>s.classList.remove("on")); el.querySelector(".bar i").style.width="0"; return; }
  const v=shownLux(); const d = v==null ? {txt:"----"} : displayValue(v);
  el.querySelector(".digits").innerHTML = `${d.txt}<small>${M.unit==="fc"?"fc":"lux"}</small>`;
  const on = k => { const s=el.querySelector(`[data-ann="${k}"]`); if(s) s.classList.toggle("on", true); };
  el.querySelectorAll(".ann span").forEach(s=>s.classList.remove("on"));
  on(M.unit==="fc"?"FC":"LUX"); if(M.hold) on("HOLD"); if(M.mm===1) on("MAX"); if(M.mm===2) on("MIN"); if(M.mm===3) on("AVG");
  if(it.autoR) on("AUTO"); else on("RANGE");
  if(it.lampSel) on("SRC"); if(it.mem && M.mem.length) on("MEM");
  const rs=el.querySelector('[data-ann="RANGE"]'); if(rs && !it.autoR) rs.textContent = "ESC " + fmt(rangeInfo().R);
  const sr=el.querySelector('[data-ann="SRC"]'); if(sr) sr.textContent = "FONTE " + ({PAD:"PADRÃO",LED:"LED",FLU:"FLUOR",SOD:"SÓDIO",MET:"METÁL"})[M.sel];
  const mm=el.querySelector('[data-ann="MEM"]'); if(mm) mm.textContent = "MEM " + M.mem.length;
  const full = it.autoR ? 1000 : rangeInfo().R;
  el.querySelector(".bar i").style.width = (v==null?0:clamp(v/full*100,0,100))+"%";
}
function meterHTML(){
  const it=INSTR[S.inst];
  const ann = ["LUX","FC","HOLD","MAX","MIN"].concat(S.inst==="LD550"?["AVG"]:[]).concat(it.autoR?["AUTO"]:["RANGE"]).concat(it.lampSel?["SRC"]:[]).concat(it.mem?["MEM"]:[]);
  const keys = [["pwr","POWER"],["unit","LUX/FC"],["hold","HOLD"],["mm","MAX/MIN"]];
  if(!it.autoR) keys.push(["range","RANGE"]);
  if(it.lampSel) keys.push(["src","FONTE"]);
  if(it.mem) keys.push(["mem","MEM"]);
  return `<div class="meter ${it.cls}">
    <div class="mtop"><b>${it.nome}</b><span>Luxímetro digital</span></div>
    <div class="lcd" id="lcd"><div class="ann">${ann.map(a=>`<span data-ann="${a}">${a}</span>`).join("")}</div><div class="digits">&nbsp;</div><div class="bar"><i></i></div></div>
    <div class="keys">${keys.map(([k,l])=>`<button class="key ${k==="pwr"?"pwr":""}" data-key="${k}">${l}</button>`).join("")}</div>
    <div class="photocell"><span class="dome"></span><span>Fotocélula ${S.inst==="LD400"?"em cabo espiral":"destacável"} · ${S.at?`posicionada no ponto <b>${esc(S.at)}</b>`:"clique em um ponto da planta para posicioná-la"}</span></div>
    <div class="disclaim">Representação esquemática para fins didáticos; não reproduz o painel real do aparelho.</div>
  </div>`;
}
function onKey(k){
  const M=S.meter, it=INSTR[S.inst];
  if(k==="pwr"){ M.on=!M.on; if(M.on){ M.powerAt=performance.now(); M.acqClean=0; M.hold=false; M.mm=0; } else { M.hold=false; M.mm=0; } }
  if(!M.on){ drawLCD(); return; }
  if(k==="unit") M.unit = M.unit==="lux"?"fc":"lux";
  if(k==="hold"){ M.hold=!M.hold; if(M.hold){ M.holdVal=shownLux(); M.holdPt=S.at; M.holdStable=M.stable; } }
  if(k==="mm"){ const maxMode = S.inst==="LD550"?3:2; M.mm = (M.mm+1)%(maxMode+1); M.mmMax=M.mmMin=null; M.mmSum=0; M.mmN=0; }
  if(k==="range"){ M.rIdx=(M.rIdx+1)%it.ranges.length; }
  if(k==="src"){ const i=it.sel.indexOf(M.sel); M.sel=it.sel[(i+1)%it.sel.length]; }
  if(k==="mem"){ const v=shownLux(); if(v!=null && it.mem){ const d=displayValue(v); if(d.num!=null){ M.mem.push(`${String(M.mem.length+1).padStart(2,"0")}  ${S.at||"--"}  ${d.txt} ${M.unit}`); if(M.mem.length>99) M.mem.shift(); const ml=$("#memList"); if(ml) ml.innerHTML=M.mem.slice().reverse().join("<br>"); } } }
  drawLCD();
}
function registrar(){
  const M=S.meter, box=$("#regMsg");
  const say=(cls,t)=>{ box.className="msg "+cls; box.innerHTML=t; box.hidden=false; };
  if(!S.at) return say("warn","Clique em um ponto da planta para posicionar a fotocélula.");
  if(!M.on) return say("warn","Ligue o aparelho (tecla POWER).");
  if(M.unit!=="lux") return say("warn","A NHO 11 expressa a iluminância em lux. Mude a unidade com a tecla LUX/FC antes de anotar.");
  if(M.mm) return say("warn","O display está mostrando MAX/MIN/AVG. Para a leitura pontual, saia dessa função (tecla MAX/MIN até apagar o indicador).");
  if(M.hold && M.holdPt!==S.at) return say("bad","O valor congelado (HOLD) foi obtido em outro ponto. Libere o HOLD e faça a leitura neste ponto.");
  const v=shownLux(); const d=displayValue(v);
  if(d.num==null) return say("bad","Leitura fora da escala. Ajuste a faixa de medição com a tecla RANGE.");
  const pt=getPt(S.at);
  const stable = M.hold ? M.holdStable : M.stable;
  const coarse = d.res && d.num>0 && d.res/d.num>.02;
  const posOk = pt.kind==="grid" ? S.pos==="h075" : S.pos==="tarefa";
  const r={v:d.num, stable, coarse, pos:S.pos, posOk, cond:S.cond, post:S.post, roupa:S.roupa, sel: INSTR[S.inst].lampSel?M.sel:"PAD", inst:S.inst, ideal: idealAt(pt)};
  S.rec[pt.id]=r;
  say(stable&&!coarse?"ok":"warn",`Ponto <b>${esc(pt.id)}</b> registrado: <b class="mono">${d.txt} lux</b>.${stable?"":" Atenção: a leitura ainda não estava estabilizada."}${coarse?" Atenção: a faixa escolhida tem resolução grosseira para este valor.":""}`);
  refreshBench();
  render._skip = true;
  updateChips();
}
function updateChips(){ const p=progress(); const c=$("#statusChips"); if(c){ const chips=c.querySelectorAll(".chip b.mono"); if(chips[0]) chips[0].textContent=`${p.g+p.t+p.e}/${p.gt+p.tt+p.et}`; }
  const st=$("#steps"); if(st) st.querySelectorAll(".st").forEach((s,i)=>s.classList.toggle("done",stepDone(i))); }
function tablesHTML(){
  const sn=S.scene, r=S.rec;
  const row=p=>{ const x=r[p.id]; return `<tr><td class="mono">${esc(p.kind==="ent"?p.id:p.id)}</td><td>${p.kind==="grid"?({r:"R",q:"Q",t:"T",p:"P"})[p.grp]:p.kind==="task"?esc(p.nome):`Entorno de ${p.task}`}</td><td class="num">${x?fmt(x.v, x.v<100?1:0):"—"}</td><td>${x?flagPills(x,p):""}</td><td>${x?`<button class="btn small" data-del="${p.id}">Apagar</button>`:""}</td></tr>`; };
  return `<div class="grid2">
   <div><h3 style="margin-bottom:6px">Malha do Anexo 1</h3>${S.caseOk?`<div class="tbl-wrap"><table><thead><tr><th>Ponto</th><th>Grupo</th><th class="num">lux</th><th>Observações</th><th></th></tr></thead><tbody>${sn.pts.map(row).join("")}</tbody></table></div>`:`<div class="msg warn">Confirme a configuração do Anexo 1 na etapa 2 para liberar a malha de pontos.</div>`}</div>
   <div><h3 style="margin-bottom:6px">Áreas de tarefa e entorno imediato</h3><div class="tbl-wrap"><table><thead><tr><th>Ponto</th><th>Local</th><th class="num">lux</th><th>Observações</th><th></th></tr></thead><tbody>${sn.tasks.map(row).join("")}${sn.ents.map(row).join("")}</tbody></table></div></div>
  </div>`;
}
function flagPills(x,p){
  const f=[];
  if(!x.stable) f.push(`<span class="pill warn">não estabilizada</span>`);
  if(!x.posOk) f.push(`<span class="pill bad">plano incorreto</span>`);
  if(x.coarse) f.push(`<span class="pill warn">resolução baixa</span>`);
  if(S.scen.janelas.length && (x.cond==="sol_aberta"||x.cond==="sol_fechada")) f.push(`<span class="pill warn">luz natural</span>`);
  if(S.scen.noturno && x.cond!=="noite") f.push(`<span class="pill bad">fora do período noturno</span>`);
  if(x.post==="inclinado") f.push(`<span class="pill warn">sombra do avaliador</span>`);
  return f.join(" ")||`<span class="pill ok">ok</span>`;
}
function refreshBench(){
  const pw=$("#planBox"); if(pw){ pw.innerHTML=planSVG({points:true}); wirePlan(); }
  const tb=$("#tables"); if(tb){ tb.innerHTML=tablesHTML(); wireTables(); }
  const pc=$(".photocell span:last-child"); if(pc) pc.innerHTML = S.at?`Fotocélula posicionada no ponto <b>${esc(S.at)}</b>`:"Clique em um ponto da planta para posicionar a fotocélula";
  const w=$("#whereTxt"); if(w) w.innerHTML = whereTxt();
}
function whereTxt(){
  if(!S.at) return "Nenhum ponto selecionado.";
  const p=getPt(S.at);
  if(p.kind==="grid") return `Ponto <b>${p.id}</b> da malha do Anexo 1 (grupo ${({r:"R",q:"Q",t:"T",p:"P"})[p.grp]}) – plano horizontal de referência a 0,75 m.`;
  if(p.kind==="task") return `Área de tarefa <b>${p.id}</b>: ${esc(p.nome)} – plano ${p.pl==="H"?"horizontal":p.pl==="V"?"vertical":"inclinado"} a ${fmt(p.z,2)} m.`;
  return `Entorno imediato <b>${p.id}</b> da tarefa ${p.task}, a 0,6 m da área da tarefa.`;
}
function wirePlan(){
  document.querySelectorAll("#planBox [data-pt]").forEach(g=>{
    const f=()=>{ S.at=g.dataset.pt; if(S.meter.hold && S.meter.holdPt!==S.at){} refreshBench(); };
    g.onclick=f; g.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); f(); } };
  });
}
function wireTables(){ document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ delete S.rec[b.dataset.del]; refreshBench(); updateChips(); }); }
function vMedicao(v){
  const sc=S.scen;
  if(!S.inst){ v.innerHTML=`<div><div class="eyebrow">Etapa 5</div><h2>Medição</h2></div><div class="msg warn">Escolha o instrumento na etapa 3 antes de medir.</div>`; return; }
  const condOpts = Object.entries(COND).filter(([k])=> sc.janelas.length || k==="noite" || !sc.noturno).map(([k,c])=>`<option value="${k}" ${S.cond===k?"selected":""}>${c.n}</option>`).join("");
  v.innerHTML = `<div><div class="eyebrow">Etapa 5</div><h2>Medição ponto a ponto</h2></div>
   <p class="lead">Clique em um ponto da planta para posicionar a fotocélula, ajuste as condições de medição, espere a leitura estabilizar e registre. Meça todos os pontos da malha (círculos), as áreas de tarefa (losangos) e o entorno imediato das tarefas com iluminação suplementar (círculos tracejados).</p>
   <div class="bench">
     <div class="plan-wrap"><div id="planBox">${planSVG({points:true})}</div>
       <div class="legend"><span><i style="background:var(--g-r)"></i>R</span><span><i style="background:var(--g-q)"></i>Q</span><span><i style="background:var(--g-t)"></i>T</span><span><i style="background:var(--g-p)"></i>P</span><span><i style="background:var(--g-task)"></i>Área de tarefa</span><span><i style="background:var(--g-ent)"></i>Entorno imediato</span><span><i style="background:var(--window)"></i>Janela</span><span><i style="background:var(--accent)"></i>Luminária</span></div>
     </div>
     <div class="meter-col">
       ${meterHTML()}
       <div class="card ctrls">
         <p class="where" id="whereTxt">${whereTxt()}</p>
         <div class="row">
           <label class="f">Posição da fotocélula<select id="posSel">${Object.entries(POS).map(([k,p])=>`<option value="${k}" ${S.pos===k?"selected":""}>${p.n}</option>`).join("")}</select></label>
         </div>
         <div class="row">
           <label class="f">Iluminação natural / período<select id="condSel">${condOpts}</select></label>
           <label class="f">Postura do avaliador<select id="postSel"><option value="afastado" ${S.post==="afastado"?"selected":""}>Afastado, sem sombrear a fotocélula</option><option value="inclinado" ${S.post==="inclinado"?"selected":""}>Inclinado sobre a fotocélula para ler o display</option></select></label>
         </div>
         <div class="row"><button class="btn primary" id="regBtn">Registrar leitura na planilha de campo</button></div>
         <div id="regMsg" class="msg" hidden></div>
         ${INSTR[S.inst].mem?`<details><summary class="note">Memória interna do aparelho</summary><div class="memlist" id="memList">${S.meter.mem.slice().reverse().join("<br>")||"vazia"}</div></details>`:""}
       </div>
     </div>
   </div>
   <div id="tables">${tablesHTML()}</div>
   ${progress().all?nextBtn("Ver resultados e relatório"):""}`;
  wirePlan(); wireTables();
  v.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>onKey(b.dataset.key));
  $("#posSel").onchange=e=>{ S.pos=e.target.value; };
  $("#condSel").onchange=e=>{ S.cond=e.target.value; };
  $("#postSel").onchange=e=>{ S.post=e.target.value; };
  $("#regBtn").onclick=()=>{ registrar(); if(progress().all && !v.querySelector("[data-next]")){ v.insertAdjacentHTML("beforeend", nextBtn("Ver resultados e relatório")); wireNext(v); } };
  wireNext(v);
  drawLCD();
}
setInterval(meterTick, 400);

<script>
"use strict";
/* ============================================================
   ABA 6 – RESULTADOS E RELATÓRIO
   ============================================================ */
const avg = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : NaN;
function mediaAnexo1(valOf){
  const sc=S.scen, sn=S.scene;
  const g = k => avg(sn.pts.filter(p=>p.grp===k).map(p=>valOf(p)).filter(v=>v!=null));
  const R=g("r"), Q=g("q"), T=g("t"), P=g("p"), N=sc.N, M=sc.M, L=sc.L, W=sc.W;
  const f1=v=>fmt(v,2);
  let I, gen, sub;
  switch(sc.caso){
    case 1: I=(R*(N-1)*(M-1)+Q*(N-1)+T*(M-1)+P)/(N*M);
      gen="Ī = [R(N−1)(M−1) + Q(N−1) + T(M−1) + P] / (N·M)";
      sub=`Ī = [${f1(R)}·(${N}−1)·(${M}−1) + ${f1(Q)}·(${N}−1) + ${f1(T)}·(${M}−1) + ${f1(P)}] / (${N}·${M})`; break;
    case 2: I=P; gen="Ī = P = (p1 + p2 + p3 + p4) / 4"; sub=`Ī = ${f1(P)}`; break;
    case 3: I=(Q*(N-1)+P)/N; gen="Ī = [Q(N−1) + P] / N"; sub=`Ī = [${f1(Q)}·(${N}−1) + ${f1(P)}] / ${N}`; break;
    case 4: I=(R*N*(M-1)+Q*N+T*(M-1)+P)/(M*(N+1)); gen="Ī = [R·N(M−1) + Q·N + T(M−1) + P] / [M(N+1)]";
      sub=`Ī = [${f1(R)}·${N}·(${M}−1) + ${f1(Q)}·${N} + ${f1(T)}·(${M}−1) + ${f1(P)}] / [${M}·(${N}+1)]`; break;
    case 5: I=(Q*N+P)/(N+1); gen="Ī = (Q·N + P) / (N + 1)"; sub=`Ī = (${f1(Q)}·${N} + ${f1(P)}) / (${N} + 1)`; break;
    case 6: I=(R*(L-8)*(W-8)+8*Q*(L-8)+8*T*(W-8)+64*P)/(W*L); gen="Ī = [R(L−8)(W−8) + 8Q(L−8) + 8T(W−8) + 64P] / (W·L)";
      sub=`Ī = [${f1(R)}·(${fmt(L,1)}−8)·(${fmt(W,1)}−8) + 8·${f1(Q)}·(${fmt(L,1)}−8) + 8·${f1(T)}·(${fmt(W,1)}−8) + 64·${f1(P)}] / (${fmt(W,1)}·${fmt(L,1)})`; break;
  }
  return {I,R,Q,T,P,gen,sub};
}
function eReq(t){
  const key = S.quadroSel[t.id] || t.q; const q=QUADRO[key];
  let i=ESCALA.indexOf(q.E); const aj = S.ajusteSel==null||S.ajusteSel==="" ? 0 : +S.ajusteSel;
  let E = ESCALA[clamp(i+aj,0,ESCALA.length-1)];
  let cont=false; if(E<200){ E=200; cont=true; }
  return {E, q, key, cont, base:q.E, aj};
}
function tabela1(E){ return E>=750?500 : E>=500?300 : E>=300?200 : E; }
function evaluate(){
  const sc=S.scen, sn=S.scene, r=S.rec;
  const med = mediaAnexo1(p=>r[p.id]?r[p.id].v:null);
  const ref = mediaAnexo1(p=>idealAt(p));
  const I=med.I;
  const tasks = sn.tasks.map(t=>{
    const v=r[t.id].v, e=eReq(t);
    const c1 = v>=.9*e.E, c2 = v>=.7*I, c3 = v>=200;
    const irc = sc.lamp.IRC>=e.q.IRC, tcp = e.q.tcp ? sc.lamp.Tcp>=e.q.tcp : true;
    return {t, v, e, c1, c2, c3, irc, tcp, ok: c1&&c2&&c3};
  });
  const vmax = Math.max(...tasks.map(x=>x.v));
  const ratio = vmax/I, ratioNA = vmax>2500, ratioOk = ratioNA || ratio<=5;
  const ents = sn.tasks.filter(t=>t.supl).map(t=>{
    const e=eReq(t), req=tabela1(e.E); const vals=sn.ents.filter(x=>x.task===t.id).map(x=>({id:x.id, v:r[x.id].v}));
    return {t, req, vals, ok: vals.every(x=>x.v>=req), min: Math.min(...vals.map(x=>x.v))};
  });
  let adj=null; if(sc.adj){ const ra=Math.max(I,sc.adj.media)/Math.min(I,sc.adj.media); adj={...sc.adj, ratio:ra, ok:ra<=5}; }
  // não conformidades de procedimento
  const recs = Object.values(r); const flags=[];
  const instBad = recs.some(x=>x.inst==="LD400") && sc.lamp.tipo==="LED";
  if(instBad) flags.push({s:"bad", t:"O LD-400 não é especificado pelo fabricante para fontes LED. O instrumento não atende ao item 6.3.1 neste ambiente e os resultados não podem ser aceitos."});
  const selBad = recs.filter(x=>INSTR[x.inst].lampSel && x.sel!==sc.lamp.tipo).length;
  if(selBad) flags.push({s:"bad", t:`${selBad} leitura(s) feitas com o seletor de fonte de luz diferente do tipo de lâmpada do ambiente (${LAMP_LABEL[sc.lamp.tipo]}). O fator de correção espectral ficou errado (item 6.3.1).`});
  const instUsed=[...new Set(recs.map(x=>x.inst))];
  if(instUsed.some(k=>S.v.certExp===k)) flags.push({s:"bad", t:"Medições feitas com instrumento de certificado de calibração vencido (item 6.3.2)."});
  if(instUsed.length>1) flags.push({s:"warn", t:`Foram usados ${instUsed.length} instrumentos diferentes na mesma avaliação (${instUsed.map(k=>INSTR[k].nome).join(", ")}).`});
  const unst = recs.filter(x=>!x.stable).length; if(unst) flags.push({s:"warn", t:`${unst} leitura(s) registradas antes da estabilização do medidor (item 6.4).`});
  const gridPos = sn.pts.filter(p=>r[p.id] && !r[p.id].posOk).length; if(gridPos) flags.push({s:"bad", t:`${gridPos} ponto(s) da malha não foram medidos em plano horizontal a 0,75 m do piso (Anexo 1).`});
  const taskPos = [...sn.tasks,...sn.ents].filter(p=>r[p.id] && !r[p.id].posOk).length; if(taskPos) flags.push({s:"bad", t:`${taskPos} ponto(s) de tarefa/entorno não foram medidos no plano da tarefa visual (item 6.4).`});
  if(sc.janelas.length){ const dl=recs.filter(x=>x.cond==="sol_aberta"||x.cond==="sol_fechada").length; if(dl) flags.push({s:"bad", t:`${dl} leitura(s) com interferência de luz natural. As medições devem ser feitas na condição mais desfavorável, com o iluminamento dependendo só das fontes instaladas (item 6.2).`}); }
  if(sc.noturno){ const nn=recs.filter(x=>x.cond!=="noite").length; if(nn) flags.push({s:"bad", t:`${nn} leitura(s) fora do período noturno, embora a atividade ocorra à noite (item 6.2).`}); }
  const sh=recs.filter(x=>x.post==="inclinado").length; if(sh) flags.push({s:"warn", t:`${sh} leitura(s) com o avaliador inclinado sobre a fotocélula, projetando sombra (item 6.2).`});
  if(recs.some(x=>x.roupa==="clara")) flags.push({s:"warn", t:"O avaliador usou roupa clara, que pode refletir luz sobre a fotocélula (item 6.2)."});
  const coarse=recs.filter(x=>x.coarse).length; if(coarse) flags.push({s:"warn", t:`${coarse} leitura(s) em faixa de medição com resolução inadequada ao valor medido.`});
  // enquadramento
  const enq=[];
  sn.tasks.forEach(t=>{ const s=S.quadroSel[t.id]; if(!s) enq.push(`${t.nome}: atividade do Quadro 1 não selecionada (usado o enquadramento de referência).`); else if(s!==t.q) enq.push(`${t.nome}: enquadrado como “${QUADRO[s].n}”; o esperado é “${QUADRO[t.q].n}”.`); });
  if((+S.ajusteSel||0)!==sc.ajuste) enq.push(sc.ajuste?`O ajuste da escala de iluminância (item 5.1) não foi aplicado: ${sc.ajusteNota}.`:"Foi aplicado ajuste na escala de iluminância sem condição que o justifique.");
  return {med, ref, I, tasks, vmax, ratio, ratioNA, ratioOk, ents, adj, flags, enq, instBad};
}
function yes(ok, na){ return na ? `<span class="pill na">não se aplica</span>` : `<span class="pill ${ok?"ok":"bad"}">${ok?"Atende":"Não atende"}</span>`; }
function findings(ev){
  const sc=S.scen, tr=truth(), f=[];
  if(ev.tasks.some(x=>!x.ok) || ev.ents.some(x=>!x.ok)) f.push("insuf");
  if(S.v.burned>=0 || (ev.med.P < .5*ev.I)) f.push("irreg");
  if(tr.a8==="N") f.push("estrob");
  if(tr.a9==="N") f.push("cint");
  if(tr.a11==="N") f.push("ofusc");
  if(sc.luznat) f.push("luznat");
  if(ev.tasks.some(x=>!x.irc||!x.tcp)) f.push("cor");
  return f;
}
